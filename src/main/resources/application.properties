spring.application.name=artissue

#Server
server.port=8181
server.servlet.session.tracking-modes=cookie

# Default Timezone
spring.jackson.time-zone=Asia/Seoul

#aws rds
spring.datasource.url=jdbc:mariadb://art-issue.c5y6coa4ko8c.ap-northeast-2.rds.amazonaws.com:3306/artissue?serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# mybatis
mybatis.config-location = classpath:/mybatis/mybatis-config.xml
# mapper
mybatis.mapper-locations = classpath:/mybatis/mapper/*.xml

# Devtools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=false
spring.freemarker.cache=false

#Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

#Logging
logging.level.root=INFO
logging.level.com.artissue=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

#HikariCP
spring.datasource.hikari.maxLifetime=597000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000
spring.datasource.hikari.leakDetectionThreshold=2000

toss.api.base-url=https://api.tosspayments.com/v1
toss.api.client-key=${TOSS_CLIENTKEY}
toss.api.secret-key=${TOSS_SECRETKEY}

# coolsms
coolsms.apiKey=${COOLSMS_APIKEY}
coolsms.apiSecret=${COOLSMS_APISECRET}
coolsms.senderNumber=${COOLSMS_NUMBER}

#registration
spring.security.oauth2.client.registration.naver.client-name=naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENTID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENTSECRET}
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8181/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email,gender,number

#provider
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

spring.security.oauth2.client.registration.kakao.client-name=kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8181/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENTID}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
