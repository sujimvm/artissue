<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <!-- Title -->
    <title>One Music - Modern Music HTML5 Template</title>

    <!-- Favicon -->
    <link rel="icon" href="/bootstrap/img/core-img/favicon.ico">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/bootstrap/style.css">

</head>

<body>
    <!-- Preloader -->
    <div class="preloader d-flex align-items-center justify-content-center">
        <div class="lds-ellipsis">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <!-- ##### Header Area Start ##### -->
    <div th:replace="~{include/header}"></div>
    <!-- ##### Header Area End ##### -->

    <!-- ##### Breadcumb Area Start ##### -->
    <section class="breadcumb-area bg-img bg-overlay" style="background-image: url(/bootstrap/img/bg-img/breadcumb3.jpg);">
        <div class="bradcumbContent">
            <p>See what’s new</p>
            <h2>Notice</h2>
        </div>
    </section>
    <!-- ##### Breadcumb Area End ##### -->

    <!-- ##### Notice Area Start ##### -->
    <div class="blog-area section-padding-100">
        <div class="container">
            <div class="row w-100">
                <div class="col-lg-12 col-12">
                    <div class="single-blog-post mb-100 wow fadeInUp" data-wow-delay="100ms">
                        <div class="blog-content">

                            <th:block th:if="${noticeList != null}">
                            <th:block th:each="notice : ${noticeList}">
                            <!-- Notice Title -->
                            <div class="post-title" th:text="${notice.notice_title}" th:onclick="toggleContent(this)"></div>
                            <!-- Notice Cont -->
                                <div class="post-content" style="display: none;" th:utext="${notice.notice_cont}"></div>
                            <!-- Notice Date -->
                            <p th:text="${notice.notice_date.substring(0, 10)}"></p>
                                <a th:href="@{/notice/modify(no=${notice.notice_key})}">수정</a>
                                <a style="cursor: pointer" th:onclick="'confirmDelete(' + ${notice.notice_key} + ')'">삭제</a>
                                <hr>

                            </th:block>
                            </th:block>

                            <th:block th:if="${noticeList == null}">
                                <p>notice X</p>
                            </th:block>
                        </div>
                        <input type="button" class="btn oneMusic-btn mt-30" value="공지사항 등록"
                               th:onclick="noticeInsert()">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleContent(titleElement) {
            var contentElement = titleElement.nextElementSibling;

            if (contentElement && contentElement.classList.contains('post-content')) {
                if (contentElement.style.display === 'none') {
                    contentElement.style.display = 'block';
                } else {
                    contentElement.style.display = 'none';
                }
            }
        }

        function noticeInsert() {
            window.location.href = '/notice/insert';
        }

        function confirmDelete(noticeKey) {
            if (confirm('정말 삭제하시겠습니까?')) {
                window.location.href = '/notice/delete?no=' + noticeKey;
            }
        }
    </script>

    <!-- ##### Contact Area Start ##### -->
    <section class="contact-area section-padding-100 bg-img bg-overlay bg-fixed has-bg-img" style="background-image: url(/bootstrap/img/bg-img/bg-2.jpg);">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="section-heading white">
                        <p>See what’s new</p>
                        <h2>Get In Touch</h2>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <!-- Contact Form Area -->
                    <div class="contact-form-area">
                        <form action="#" method="post">
                            <div class="row">
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <input type="text" class="form-control" id="name" placeholder="Name">
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <input type="email" class="form-control" id="email" placeholder="E-mail">
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <input type="text" class="form-control" id="subject" placeholder="Subject">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-group">
                                        <textarea name="message" class="form-control" id="message" cols="30" rows="10" placeholder="Message"></textarea>
                                    </div>
                                </div>
                                <div class="col-12 text-center">
                                    <button class="btn oneMusic-btn mt-30" type="submit">Send <i class="fa fa-angle-double-right"></i></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- ##### Contact Area End ##### -->

    <!-- ##### Footer Area Start ##### -->
    <div th:replace="~{include/footer}"></div>
    <!-- ##### Footer Area Start ##### -->

    <!-- ##### All Javascript Script ##### -->
    <!-- jQuery-2.2.4 js -->
    <script src="/bootstrap/js/jquery/jquery-2.2.4.min.js"></script>
    <!-- Popper js -->
    <script src="/bootstrap/js/bootstrap/popper.min.js"></script>
    <!-- Bootstrap js -->
    <script src="/bootstrap/js/bootstrap/bootstrap.min.js"></script>
    <!-- All Plugins js -->
    <script src="/bootstrap/js/plugins/plugins.js"></script>
    <!-- Active js -->
    <script src="/bootstrap/js/active.js"></script>
</body>



</html>
