<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
<div>
    <table>
        <tr>
            <td rowspan="3" ><img th:src="${ExhiDTO.getExhibition_thumnail()}"></td>
            <td th:text="${ExhiDTO.getExhibition_title()}"></td>
        </tr>
        <tr>
            <td th:text="${ExhiDTO.getExhibition_start_date() +'~'+ ExhiDTO.getExhibition_end_date()}"></td>
        </tr>
        <tr>
            <td th:text="${ExhiDTO.getExhibition_place()}"></td>
        </tr>
    </table>
</div>
<div>
    <div>
        <form action="/sendReserve" id="reserveFrom" method="post">
            <input type="hidden" name="exhibition_key" th:alue="${ExhiDTO.getExhibition_key()}">
            <table th:if="${#lists.isEmpty(PriceList)}" >
                <tr>
                    <td>일반</td>
                    <td>판매종료</td>
                </tr>
            </table>
            <table th:unless="${#lists.isEmpty(PriceList)}" >
                <tr th:each="dto:${PriceList}">
                    <td th:text="${dto.getPrice_option()}"></td>
                    <td th:text="${dto.getPrice()}"></td>
                </tr>
            </table>
        </form>
    </div>
    <div>
        <div>

        </div>
        <button type="button" id="reserveBt" class="btn oneMusic-btn mt-30">Reserve</button>
    </div>
</div>
<script src="/js/reservation/popup.js"></script>
</body>
</html>
