<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <!-- Title -->
    <title>ART ISSUE :: 비밀번호 찾기</title>

    <!-- Favicon -->
    <link rel="icon" href="/bootstrap/img/core-img/favicon.ico">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/bootstrap/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        //비밀번호 체크
        $(function(){
            $('#Password1').on('input', function() {
                var pwd = $(this).val();
                var pwdPattern = /^(?=.*[!@#$%^&*(),.?":{}|<>])[A-Za-z\d!@#$%^&*(),.?":{}|<>]{8,20}$/;
                if (pwdPattern.test(pwd)) {
                    $('#pwdCheckmark').show();
                    $('#pwdError').hide();
                } else {
                    $('#pwdCheckmark').hide();
                    $('#pwdError').show();
                }
            });
        });

        $(function(){
            var pwd_check = false;
            $("#Password2").on('input', function(){
                pwdCheck($(this).val());
            });

            function pwdCheck(pwd){
                if(pwd==""){
                    $("#pwd_check_ok").hide();
                    $("#pwd_check_err").hide();
                    return;
                }

                if($("#Password2").val() === $("#Password1").val()){
                    $("#pwd_check_ok").show();
                    $("#pwd_check_err").hide();
                }else{
                    $("#pwd_check_ok").hide();
                    $("#pwd_check_err").show();
                }
            };
        });
    </script>

    <style>

        .link-container{
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;

        }

    </style>
</head>
<body>
<!-- Preloader -->
<div class="preloader d-flex align-items-center justify-content-center">
    <div class="lds-ellipsis">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>

<!-- ##### Header Area Start ##### -->
<div th:replace="~{include/header}"></div>
<!-- ##### Header Area End ##### -->

<!-- ##### Breadcumb Area Start ##### -->
<section class="breadcumb-area bg-img bg-overlay" style="background-image: url(/bootstrap/img/bg-img/breadcumb3.jpg);">
    <div class="bradcumbContent">
        <p>See what’s new</p>
        <h2>NEW PASSWORD</h2>
    </div>
</section>
<!-- ##### Breadcumb Area End ##### -->

<!-- ##### Login Area Start ##### -->
<section class="login-area section-padding-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="login-content">
                    <h3>Welcome Back</h3>
                    <!-- Login Form -->
                    <div class="login-form">
                        <form th:action="@{/updatePassword}" method="post">

                            <input type="hidden" name="member_id" th:value="${member_id}">

                            <div class="form-group">
                                <label for="Password1">비밀번호</label>
                                <input type="password" name="member_pwd" class="form-control" id="Password1"  placeholder="새 비밀번호를 입력하세요" required>
                                <span id="pwdCheckmark" class="checkmark" style="display: none;">✔</span>
                                <span id="pwdError" style="display: none; color: red; font-size: 12px;">
                                    비밀번호는 8자 이상 20자 이하이며 특수문자 1자를 포함해야 합니다.
                                </span>
                            </div>
                            <div class="form-group">
                                <label for="Password2">비밀번호 확인</label>
                                <input type="password" name="confirm_pwd" class="form-control" id="Password2" placeholder="새 비밀번호를 확인" required>
                                <span id="pwd_check_err" style="display: none; color: red; font-size: 12px;">
                                    위의 비밀번호와 입력된 비밀번호가 다릅니다.</span>
                                <span id="pwd_check_ok" class="checkmark" style="display: none;">✔</span>
                            </div>
                            <div class="link-container">
                                <a href="/findbyId">아이디 / 비밀번호 찾기</a>
                                <a href="/join">회원가입</a>
                            </div>
                            <button type="submit" class="btn oneMusic-btn mt-30">비밀번호 변경</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- ##### Login Area End ##### -->

<!-- ##### Footer Area Start ##### -->
<div th:replace="~{include/footer}"></div>
<!-- ##### Footer Area Start ##### -->

<!-- ##### All Javascript Script ##### -->
<!-- jQuery-2.2.4 js -->
<script src="/bootstrap/js/jquery/jquery-2.2.4.min.js"></script>
<!-- Popper js -->
<script src="/bootstrap/js/bootstrap/popper.min.js"></script>
<!-- Bootstrap js -->
<script src="/bootstrap/js/bootstrap/bootstrap.min.js"></script>
<!-- All Plugins js -->
<script src="/bootstrap/js/plugins/plugins.js"></script>
<!-- Active js -->
<script src="/bootstrap/js/active.js"></script>
</body>

</html>
